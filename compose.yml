name: safe-release-lab

x-control: &control
  image: safe-release-control:local
  build:
    context: .
    dockerfile: docker/controller.Dockerfile

services:
  keys:
    <<: *control
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ ! -s /keys/id_ed25519 ]; then
          ssh-keygen -q -t ed25519 -N '' -f /keys/id_ed25519
        fi
        chmod 600 /keys/id_ed25519
    volumes:
      - ssh-keys:/keys

  managed:
    build:
      context: .
      dockerfile: docker/managed.Dockerfile
    privileged: true
    cgroup: private
    environment:
      container: docker
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ssh-keys:/lab-keys:ro
      - docker-data:/var/lib/docker
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-18082}:80"
      - "127.0.0.1:${LAB_BG_HTTP_PORT:-18083}:8081"
    stop_signal: SIGRTMIN+3
    stop_grace_period: 45s
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'systemctl is-active --quiet ssh.service docker.service && docker info >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      start_period: 40s
      retries: 30

  control:
    <<: *control
    profiles: [tools]
    working_dir: /work
    environment:
      ANSIBLE_CONFIG: /work/ansible.cfg
      ANSIBLE_INVENTORY: /work/inventory/docker.yml
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - .:/work:ro
      - ssh-keys:/lab-keys:ro
volumes:
  ssh-keys:
  docker-data:
